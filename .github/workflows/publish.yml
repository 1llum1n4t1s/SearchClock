name: Publish to Chrome Web Store

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Chrome Web Store 公開
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Prepare Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json

      - name: 依存インストール
        # bun run deps で bun.lock の integrity を検証してインストール
        # browser回帰テストはrunner組み込みChromeを使うため、Puppeteer管理Chromeの取得は不要
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: bun run deps

      - name: 回帰テスト
        # 公開前ゲート: 共有関数、SW競合、runner組み込みChromeでのコンテンツUIを検証。
        # 失敗したら以降のパッケージング・アップロードを実行しない。
        run: bun --bun run test

      - name: Google ドメインリストの 3 箇所同期チェック
        # manifest.json (matches / host_permissions) と background.js (GOOGLE_DOMAINS) のズレを検知。
        # 片側欠落は部分機能不全 (DNR は動くが content script 未注入 等) を生む。
        run: bun scripts/check-domains.js

      - name: アイコン生成
        run: bun scripts/generate-icons.js

      - name: zip パッケージを作成
        run: |
          zip -r search-clock.zip manifest.json icons src \
            -x "*.DS_Store" "*.swp" "*~" "*.test.js" "*.test.mjs"
          ls -lh search-clock.zip

      - name: 提出ZIPの版・構成・ハッシュを検証
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          unzip -t search-clock.zip
          bun - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync, appendFileSync } = require('node:fs');
          const { createHash } = require('node:crypto');
          const assert = require('node:assert/strict');
          const zip = 'search-clock.zip';
          const originalHash = createHash('sha256').update(readFileSync(zip)).digest('hex');
          const entries = execFileSync('unzip', ['-Z1', zip], { encoding: 'utf8' }).trim().split('\n');
          assert.equal(new Set(entries).size, entries.length, 'ZIP内の重複エントリ');
          const files = entries.filter(entry => !entry.endsWith('/')).sort();
          const source = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const tracked = execFileSync('git', ['ls-files', '-z', 'manifest.json', 'icons', 'src'], { encoding: 'utf8' })
            .split('\0').filter(Boolean)
            .filter(entry => !/(?:\.DS_Store|\.swp|~|\.test\.js|\.test\.mjs)$/.test(entry));
          const expected = [...new Set([...tracked, ...Object.values(source.action.default_icon)])].sort();
          assert.deepEqual(files, expected, 'ZIPの不足・余分なファイル');
          const hash = data => createHash('sha256').update(data).digest('hex');
          for (const entry of files) {
            assert.equal(hash(execFileSync('unzip', ['-p', zip, entry])), hash(readFileSync(entry)), entry);
          }
          const manifest = JSON.parse(execFileSync('unzip', ['-p', zip, 'manifest.json'], { encoding: 'utf8' }));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(manifest.version, process.env.RELEASE_VERSION);
          assert.equal(manifest.version, pkg.version);
          assert.equal(manifest.name, source.name);
          assert.equal(manifest.manifest_version, 3);
          const sha256 = hash(readFileSync(zip));
          assert.equal(sha256, originalHash, 'ZIP changed during verification');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\n`);
          console.log(JSON.stringify({ source: process.env.GITHUB_SHA, version: manifest.version, files: files.length, sha256 }));
          NODE

      - name: Chrome Web Store にアップロード & 公開
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "search-clock.zip" -ExpectedSha256 "$PACKAGE_SHA256"
