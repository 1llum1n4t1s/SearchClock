name: Publish to Chrome Web Store
# CWS は「アップロード」と「審査への申請」を別 workflow に分けている。
# この workflow は検証済みZIPを下書きとしてアップロードするだけで、申請しない。
# 申請は掲載画像などを Dashboard で整えた後に、cws-submit.yml を手動で実行する。

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # push の run が出なかったときの再実行専用。一部 job の失敗は `gh run rerun <id> --failed` を使う。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Chrome Web Store アップロード（申請は cws-submit.yml）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: タグと manifest バージョンの整合性を確認
        # タグ（厳密な v<x.y.z>・軽量タグがこの commit を指す・既定ブランチの祖先）と manifest の版の一致を、無条件に確認する。
        # Secrets を使う step より前に置く。
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$MANIFEST_VERSION"
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo "::error::タグ以外では配信しません: $GITHUB_REF"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::版タグ v<x.y.z> の形ではありません: $GITHUB_REF_NAME"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit id が不正です"; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::タグ ($GITHUB_REF_NAME) と manifest.json の版 ($version) が一致しません。期待値: v$version"; exit 1; }
          # 軽量タグで、いまもこの commit を指すこと（注釈付きタグ・付け替え済みのタグを拒否する）。
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')" == "commit $GITHUB_SHA" ]] \
            || { echo "::error::タグ $GITHUB_REF_NAME が $GITHUB_SHA を指す軽量タグではありません"; exit 1; }
          # 既定ブランチの祖先であること（depth=1 の checkout では判定できないので compare API を使う）。
          default="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          [[ "$default" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::既定ブランチ名が不正です"; exit 1; }
          cmp="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default?per_page=1" --jq '.status + " " + (.behind_by | tostring)')"
          [[ "$cmp" == "ahead 0" || "$cmp" == "identical 0" ]] || { echo "::error::$default の祖先ではありません ($cmp)"; exit 1; }
          echo "✅ 配信対象: $GITHUB_REF_NAME ($GITHUB_SHA)"

      - name: Prepare Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json

      - name: 依存インストール
        # bun run deps で bun.lock の integrity を検証してインストール
        # browser回帰テストはrunner組み込みChromeを使うため、Puppeteer管理Chromeの取得は不要
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: bun run deps

      - name: 回帰テスト
        # 公開前ゲート: 共有関数、SW競合、runner組み込みChromeでのコンテンツUIを検証。
        # 失敗したら以降のパッケージング・アップロードを実行しない。
        run: bun --bun run test

      - name: Google ドメインリストの 3 箇所同期チェック
        # manifest.json (matches / host_permissions) と background.js (GOOGLE_DOMAINS) のズレを検知。
        # 片側欠落は部分機能不全 (DNR は動くが content script 未注入 等) を生む。
        run: bun scripts/check-domains.js

      - name: アイコン生成
        run: bun scripts/generate-icons.js

      - name: zip パッケージを作成
        run: |
          zip -r search-clock.zip manifest.json _locales icons src \
            -x "*.DS_Store" "*.swp" "*~" "*.test.js" "*.test.mjs"
          ls -lh search-clock.zip

      - name: 提出ZIPの版・構成・ハッシュを検証
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          unzip -t search-clock.zip
          bun - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync, appendFileSync } = require('node:fs');
          const { createHash } = require('node:crypto');
          const assert = require('node:assert/strict');
          const zip = 'search-clock.zip';
          const originalHash = createHash('sha256').update(readFileSync(zip)).digest('hex');
          const entries = execFileSync('unzip', ['-Z1', zip], { encoding: 'utf8' }).trim().split('\n');
          assert.equal(new Set(entries).size, entries.length, 'ZIP内の重複エントリ');
          const files = entries.filter(entry => !entry.endsWith('/')).sort();
          const source = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const tracked = execFileSync('git', ['ls-files', '-z', 'manifest.json', '_locales', 'icons', 'src'], { encoding: 'utf8' })
            .split('\0').filter(Boolean)
            .filter(entry => !/(?:\.DS_Store|\.swp|~|\.test\.js|\.test\.mjs)$/.test(entry));
          const expected = [...new Set([...tracked, ...Object.values(source.action.default_icon)])].sort();
          assert.deepEqual(files, expected, 'ZIPの不足・余分なファイル');
          const hash = data => createHash('sha256').update(data).digest('hex');
          for (const entry of files) {
            assert.equal(hash(execFileSync('unzip', ['-p', zip, entry])), hash(readFileSync(entry)), entry);
          }
          const manifest = JSON.parse(execFileSync('unzip', ['-p', zip, 'manifest.json'], { encoding: 'utf8' }));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(manifest.version, process.env.RELEASE_VERSION);
          assert.equal(manifest.version, pkg.version);
          assert.equal(manifest.name, source.name);
          assert.equal(manifest.manifest_version, 3);
          const sha256 = hash(readFileSync(zip));
          assert.equal(sha256, originalHash, 'ZIP changed during verification');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\n`);
          console.log(JSON.stringify({ source: process.env.GITHUB_SHA, version: manifest.version, files: files.length, sha256 }));
          NODE

      - name: Chrome Web Store にアップロード（下書き）
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "search-clock.zip" -ExpectedSha256 "$PACKAGE_SHA256" -Stage Upload
